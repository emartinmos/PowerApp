<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fondo Negro OLED Industrial con Borde Interior Sutil -->
  <rect width="512" height="512" fill="#000000"/>
  <rect x="16" y="16" width="480" height="480" rx="36" fill="none" stroke="#1A1A1A" stroke-width="4"/>

  <!-- Disco Calibrado de Competición 25 KG (Rojo Carmesí Oficial) -->
  <!-- Borde Exterior / Labio del Disco -->
  <circle cx="256" cy="256" r="204" fill="#E50914" stroke="#99060E" stroke-width="6"/>

  <!-- Anillo de Bisel Exterior -->
  <circle cx="256" cy="256" r="188" fill="none" stroke="#B80710" stroke-width="3"/>

  <!-- Superficie Rebajada Central del Disco -->
  <circle cx="256" cy="256" r="146" fill="#CC0812" stroke="#8A050C" stroke-width="4"/>

  <!-- Marcas Técnicas de Cuadrante / Centrado -->
  <line x1="256" y1="56" x2="256" y2="76" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="256" y1="436" x2="256" y2="456" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="56" y1="256" x2="76" y2="256" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="436" y1="256" x2="456" y2="256" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

  <!-- Texto Técnico Superior: 25 KG -->
  <text x="256" y="206" text-anchor="middle" fill="#FFFFFF" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="34" font-weight="900" letter-spacing="4">25 KG</text>

  <!-- Texto Técnico Inferior: POWERLIFTING -->
  <text x="256" y="322" text-anchor="middle" fill="#F0F0F0" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="14" font-weight="800" letter-spacing="6">POWERLIFTING</text>

  <!-- Tapones de Calibración Posterior (Calibrated Plugs) -->
  <circle cx="256" cy="148" r="5" fill="#141414" stroke="#404040" stroke-width="1.5"/>
  <circle cx="256" cy="364" r="5" fill="#141414" stroke="#404040" stroke-width="1.5"/>

  <!-- Collarín / Buje Central de Acero Mecanizado (Hub) -->
  <circle cx="256" cy="256" r="70" fill="#262626" stroke="#444444" stroke-width="4"/>
  <circle cx="256" cy="256" r="56" fill="#1A1A1A" stroke="#333333" stroke-width="2"/>

  <!-- Orificio Olímpico Central (50 mm Calibrado) con Bisel Metálico -->
  <circle cx="256" cy="256" r="28" fill="#000000" stroke="#FFFFFF" stroke-width="3.5"/>
</svg>
